<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yazı | Berke Deniz Yüksekdağ</title><meta name="robots" content="index,follow"><style>:root{--bg:#0d0f14;--card:#181c25;--line:#292e3a;--gold:#d9a44a;--text:#f2eee4;--muted:#a6a298}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;line-height:1.8}.nav{max-width:900px;margin:auto;padding:22px 20px;border-bottom:1px solid var(--line)}.nav a{color:var(--gold);text-decoration:none;font-weight:700}.article{max-width:820px;margin:auto;padding:55px 20px 90px}.cat{color:var(--gold);font-size:12px;text-transform:uppercase;letter-spacing:.12em}h1{font-family:Georgia,serif;font-size:clamp(36px,7vw,64px);line-height:1.08;margin:12px 0 18px}.summary{font-size:18px;color:var(--muted);margin-bottom:18px}.meta{font-size:12px;color:var(--muted);padding-bottom:25px;border-bottom:1px solid var(--line)}.content{margin-top:36px;font-size:17px}.content h2,.content h3{font-family:Georgia,serif;line-height:1.25;margin-top:38px}.content a{color:var(--gold)}.content img{max-width:100%;height:auto;border-radius:14px}.content blockquote{border-left:3px solid var(--gold);margin:28px 0;padding:5px 0 5px 20px;color:var(--muted)}.error{padding:40px 0;color:var(--muted)}</style></head><body><nav class="nav"><a href="index.html#yazilar">← Yazılara dön</a></nav><article class="article" id="article"><div class="error">Yazı yükleniyor…</div></article><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyBv3kaf0kCyP0WqFXtbmROTTVtj57upEFY",authDomain:"berke-web-panel.firebaseapp.com",projectId:"berke-web-panel",storageBucket:"berke-web-panel.firebasestorage.app",messagingSenderId:"956917805545",appId:"1:956917805545:web:46b1b3ba5a5881b7d1db78",measurementId:"G-NZ358NMQ0F"};const db=getFirestore(initializeApp(firebaseConfig));const id=new URLSearchParams(location.search).get("id"),root=document.getElementById("article");const esc=(s="")=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function date(v){if(!v)return"";const d=v.toDate?v.toDate():new Date(v);return new Intl.DateTimeFormat("tr-TR",{day:"numeric",month:"long",year:"numeric"}).format(d)}async function load(){if(!id){root.innerHTML='<div class="error">Yazı bulunamadı.</div>';return}try{const snap=await getDoc(doc(db,"blogs",id));if(!snap.exists()||snap.data().published!==true){root.innerHTML='<div class="error">Bu yazı bulunamadı veya yayında değil.</div>';return}const x=snap.data();document.title=`${x.title} | Berke Deniz Yüksekdağ`;root.innerHTML=`<div class="cat">${esc(x.categoryLabel||x.category||"Yazı")}</div><h1>${esc(x.title)}</h1><div class="summary">${esc(x.summary||"")}</div><div class="meta">${esc(date(x.publishedAt||x.createdAt))}</div><div class="content">${DOMPurify.sanitize(x.content||"")}</div>`}catch(e){console.error(e);root.innerHTML='<div class="error">Yazı yüklenirken bir sorun oluştu.</div>'}}load();</script></body></html>
