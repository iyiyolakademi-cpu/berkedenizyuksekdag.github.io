<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blog Yönetim Paneli</title>
<style>:root{--bg:#0d0f14;--card:#181c25;--line:#2a303c;--gold:#d9a44a;--text:#f2eee4;--muted:#9297a3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px}h1,h2{margin:0 0 18px}label{display:block;font-size:12px;color:var(--muted);margin:14px 0 7px}input,select,textarea{width:100%;background:#11141b;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:12px;font:inherit}textarea{min-height:110px;resize:vertical}#content{min-height:330px;font-family:monospace}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:999px;padding:11px 17px;font-weight:700;cursor:pointer}.primary{background:var(--gold);color:#171208}.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}.danger{background:#7d2929;color:#fff}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.status{color:var(--muted);font-size:13px}.post{display:grid;grid-template-columns:1fr auto;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}.post:last-child{border:0}.post h3{margin:0 0 6px}.post small{color:var(--muted)}.hidden{display:none!important}.login{max-width:430px;margin:10vh auto}.preview{background:#fff;color:#171717;border-radius:14px;padding:25px;max-height:520px;overflow:auto}.preview img{max-width:100%}@media(max-width:700px){.wrap{padding:16px}.grid{grid-template-columns:1fr}.post{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body>
<div class="wrap"><section id="loginBox" class="card login"><h1>Yönetim Paneli</h1><p class="status">Blog yazılarını yönetmek için giriş yap.</p><label>E-posta</label><input id="email" type="email" autocomplete="username"><label>Şifre</label><input id="password" type="password" autocomplete="current-password"><div class="actions"><button class="primary" id="loginBtn">Giriş Yap</button></div><p id="loginMsg" class="status"></p></section>
<main id="panel" class="hidden"><div class="top card"><div><h1 style="margin-bottom:5px">Blog Yönetimi</h1><div id="userInfo" class="status"></div></div><button class="ghost" id="logoutBtn">Çıkış Yap</button></div>
<section class="card"><h2 id="formTitle">Yeni Yazı</h2><input id="editId" type="hidden"><div class="grid"><div><label>Başlık</label><input id="title" placeholder="Yazı başlığı"><label>Kategori</label><select id="category"><option value="girisimcilik">Girişimcilik</option><option value="kisisel-gelisim">Kişisel Gelişim</option><option value="hayat">Hayat</option><option value="diger">Diğer</option></select></div><div><label>Kısa açıklama</label><textarea id="summary" placeholder="Ana sayfadaki kartta görünecek kısa açıklama"></textarea><label><input id="published" type="checkbox" style="width:auto"> Hemen yayınla</label></div></div><label>Yazı içeriği (HTML kullanabilirsin)</label><textarea id="content" placeholder="<h2>Başlık</h2>&#10;<p>Yazı...</p>"></textarea><div class="actions"><button class="primary" id="saveBtn">Kaydet</button><button class="ghost" id="previewBtn">Önizle</button><button class="ghost" id="clearBtn">Temizle</button></div><p id="formMsg" class="status"></p></section>
<section id="previewCard" class="card hidden"><h2>Önizleme</h2><div id="preview" class="preview"></div></section>
<section class="card"><h2>Yazılar</h2><div id="posts" class="status">Yükleniyor…</div></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import {getFirestore,collection,getDocs,addDoc,doc,updateDoc,deleteDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBv3kaf0kCyP0WqFXtbmROTTVtj57upEFY",authDomain:"berke-web-panel.firebaseapp.com",projectId:"berke-web-panel",storageBucket:"berke-web-panel.firebasestorage.app",messagingSenderId:"956917805545",appId:"1:956917805545:web:46b1b3ba5a5881b7d1db78",measurementId:"G-NZ358NMQ0F"};
const ADMIN_UID="jdnJwVoe5XOVu05AmKPX5Zqh10H3"; const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app); const $=id=>document.getElementById(id); let cache=[];
const labels={girisimcilik:"Girişimcilik","kisisel-gelisim":"Kişisel Gelişim",hayat:"Hayat",diger:"Diğer"};
$("loginBtn").onclick=async()=>{try{$("loginMsg").textContent="Giriş yapılıyor…";await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);$("loginMsg").textContent=""}catch(e){$("loginMsg").textContent="Giriş başarısız. E-posta veya şifreyi kontrol et."}};
$("logoutBtn").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{if(user&&user.uid===ADMIN_UID){$("loginBox").classList.add("hidden");$("panel").classList.remove("hidden");$("userInfo").textContent=user.email||"Yönetici";await loadPosts()}else{if(user)await signOut(auth);$("panel").classList.add("hidden");$("loginBox").classList.remove("hidden")}});
function clearForm(){$("editId").value="";$("title").value="";$("summary").value="";$("content").value="";$("category").value="girisimcilik";$("published").checked=true;$("formTitle").textContent="Yeni Yazı";$("formMsg").textContent="";$("previewCard").classList.add("hidden")}
$("clearBtn").onclick=clearForm;
$("previewBtn").onclick=()=>{$("preview").innerHTML=DOMPurify.sanitize(`<h1>${$("title").value}</h1>`+$("content").value);$("previewCard").classList.remove("hidden")};
$("saveBtn").onclick=async()=>{const title=$("title").value.trim(),content=$("content").value.trim();if(!title||!content){$("formMsg").textContent="Başlık ve içerik zorunlu.";return}const published=$("published").checked;const data={title,summary:$("summary").value.trim(),category:$("category").value,categoryLabel:labels[$("category").value],content,published,updatedAt:serverTimestamp()};try{$("saveBtn").disabled=true;const id=$("editId").value;if(id){if(published&&!cache.find(x=>x.id===id)?.published)data.publishedAt=serverTimestamp();await updateDoc(doc(db,"blogs",id),data)}else{data.createdAt=serverTimestamp();if(published)data.publishedAt=serverTimestamp();await addDoc(collection(db,"blogs"),data)}clearForm();$("formMsg").textContent="Kaydedildi.";await loadPosts()}catch(e){console.error(e);$("formMsg").textContent="Kaydetme sırasında hata oluştu. Firestore kurallarını kontrol et."}finally{$("saveBtn").disabled=false}};
async function loadPosts(){try{const snap=await getDocs(collection(db,"blogs"));cache=snap.docs.map(d=>({id:d.id,...d.data()}));cache.sort((a,b)=>(b.updatedAt?.toMillis?.()||b.createdAt?.toMillis?.()||0)-(a.updatedAt?.toMillis?.()||a.createdAt?.toMillis?.()||0));$("posts").innerHTML=cache.length?cache.map(x=>`<div class="post"><div><h3>${esc(x.title)}</h3><small>${esc(x.categoryLabel||x.category)} · ${x.published?"Yayında":"Taslak"}</small></div><div class="actions" style="margin:0"><button class="ghost" data-edit="${x.id}">Düzenle</button><button class="danger" data-delete="${x.id}">Sil</button></div></div>`).join(""):"Henüz yazı yok.";document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editPost(b.dataset.edit));document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>removePost(b.dataset.delete))}catch(e){console.error(e);$("posts").textContent="Yazılar okunamadı. Yönetici okuma yetkisini Firestore kurallarında açmalısın."}}
function editPost(id){const x=cache.find(v=>v.id===id);if(!x)return;$("editId").value=id;$("title").value=x.title||"";$("summary").value=x.summary||"";$("category").value=x.category||"diger";$("content").value=x.content||"";$("published").checked=!!x.published;$("formTitle").textContent="Yazıyı Düzenle";scrollTo({top:0,behavior:"smooth"})}
async function removePost(id){if(!confirm("Bu yazıyı kalıcı olarak silmek istiyor musun?"))return;await deleteDoc(doc(db,"blogs",id));await loadPosts()}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
</script></body></html>
